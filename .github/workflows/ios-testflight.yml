name: Laureol iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed archive to App Store Connect
        type: boolean
        default: false
      distribution:
        description: Distribution audience
        type: choice
        options:
          - internal
          - app-store
        default: internal
      test_ads:
        description: Enable Google's sample banner in this internal build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: laureol-testflight

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Check and archive the iPhone app
        env:
          LAUREOL_TEST_ADS: ${{ inputs.test_ads }}
          LAUREOL_DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub
          ads_mode=off
          build_name=()
          if [[ "$LAUREOL_DISTRIBUTION" == app-store ]]; then
            [[ "$LAUREOL_TEST_ADS" != true ]] || { echo '::error::Use test ads only for internal builds.'; exit 1; }
            build_name=(--build-name=1.0)
          fi
          if [[ "$LAUREOL_TEST_ADS" == "true" ]]; then
            ads_mode=test
          fi
          flutter build ipa --release --no-codesign --no-pub --build-number="$GITHUB_RUN_NUMBER" --dart-define="LAUREOL_ADS_MODE=$ads_mode" "${build_name[@]}"
          archive="$PWD/build/ios/archive/Runner.xcarchive"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archive/Info.plist")" = com.jordonpark.laureol

      - name: Sign and upload to App Store Connect
        if: inputs.upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          LAUREOL_DISTRIBUTION: ${{ inputs.distribution }}
        shell: bash
        run: |
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ || ! "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo '::error::The Apple team or App Store Connect signing key is missing.'
            exit 1
          fi
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/laureol-sign.XXXXXX")
          key="$scratch/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          unset ASC_PRIVATE_KEY

          archive="$PWD/build/ios/archive/Runner.xcarchive"
          frameworks="$archive/Products/Applications/Runner.app/Frameworks"
          # Match the ad-hoc signatures on Flutter's embedded frameworks so
          # Xcode can replace them with the team's signature during export.
          for name in GoogleMobileAds UserMessagingPlatform; do
            framework="$frameworks/$name.framework"
            test -d "$framework"
            codesign --force --sign - "$framework"
            codesign --verify --strict "$framework"
          done

          options="$scratch/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          if [[ "$LAUREOL_DISTRIBUTION" == internal ]]; then
            plutil -insert testFlightInternalTestingOnly -bool YES "$options"
          fi

          xcodebuild -exportArchive -archivePath "$archive" \
            -exportPath "$scratch/export" -exportOptionsPlist "$options" \
            -allowProvisioningUpdates -authenticationKeyPath "$key" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
